<script>
const units=[
{title:'Unit 1 – My new school',sets:[
{title:'Bài 1 – Complete the passage',passage:'In England, when the schoolchildren come to school, they first (1) _____ to the cloakroom. They take (2) _____ their coats and raincoats, their caps and hats, and then go to (3) _____ classroom. Some of the students go to the laboratories and workshops where they (4) _____ physics, chemistry and art. When a student is (5) _____ duty, he comes to (6) _____ very early. He has to open (7) _____ the windows, water the flowers and clean the blackboard, so everything is ready for the first lesson. At seven thirty the teacher comes into the room and the lesson (8) _____.',vi:'Ở Anh, khi học sinh đến trường, đầu tiên các em đến phòng treo đồ. Các em cởi áo khoác, áo mưa, mũ lưỡi trai và mũ, rồi đi vào lớp học của mình. Một số học sinh đến phòng thí nghiệm và xưởng thực hành, nơi các em học vật lý, hóa học và mỹ thuật. Khi một học sinh trực nhật, em ấy đến trường rất sớm. Em phải mở tất cả cửa sổ, tưới hoa và lau bảng để mọi thứ sẵn sàng cho tiết học đầu tiên. Lúc bảy giờ rưỡi, giáo viên bước vào phòng và bài học bắt đầu.',items:[
['Blank (1): they first _____ to the cloakroom.',['go','goes','going','gone'],0,'Sau chủ ngữ số nhiều “they” dùng động từ nguyên mẫu “go”.','Học sinh đầu tiên đi đến phòng treo đồ.'],
['Blank (2): They take _____ their coats.',['on','off','up','in'],1,'Cụm động từ “take off” nghĩa là cởi (quần áo).','Các em cởi áo khoác.'],
['Blank (3): go to _____ classroom.',['they','them','their','theirs'],2,'Trước danh từ “classroom” cần tính từ sở hữu “their”.','Các em đi vào lớp học của mình.'],
['Blank (4): where they _____ physics, chemistry and art.',['learn','learns','learning','learnt'],0,'Chủ ngữ “they” đi với động từ “learn”.','Các em học vật lý, hóa học và mỹ thuật.'],
['Blank (5): is _____ duty.',['at','on','in','for'],1,'Cụm cố định “on duty” nghĩa là đang trực/đang làm nhiệm vụ.','Khi một học sinh trực nhật.'],
['Blank (6): comes to _____ very early.',['class','school','home','room'],1,'“Come to school” là đến trường; “school” không dùng mạo từ trong cách nói này.','Em ấy đến trường rất sớm.'],
['Blank (7): open _____ the windows.',['every','all','each','whole'],1,'“All the windows” nghĩa là tất cả các cửa sổ.','Em ấy phải mở tất cả các cửa sổ.'],
['Blank (8): the lesson _____.',['begin','begins','beginning','begun'],1,'Chủ ngữ “the lesson” số ít nên dùng hiện tại đơn “begins”.','Bài học bắt đầu.']
]},
{title:'Bài 2 – Tom’s first day',passage:'Mr Green: How was your first day at school, Tom?\\nTom: It was great, Dad. I had a good time. But I was a little worried at first.\\nMr Green: Why were you worried?\\nTom: The teachers were all new to me. Most of my classmates were new, too.\\nMr Green: Were they friendly to you?\\nTom: Oh, yes. They were all nice to me. Today we had maths, geography and IT. IT is my favourite subject.\\nMr Green: So everything is going well at school?\\nTom: Yes. I had a good first day. And, Dad, can I join the judo club at school? I love doing judo.\\nMr Green: Yes, OK, if you like. But don’t forget to do your homework.',vi:'Ông Green: Ngày đầu tiên ở trường của con thế nào, Tom?\\nTom: Tuyệt lắm bố ạ. Con đã có khoảng thời gian vui vẻ. Nhưng lúc đầu con hơi lo lắng.\\nÔng Green: Sao con lo lắng?\\nTom: Các giáo viên đều mới đối với con. Hầu hết bạn cùng lớp cũng mới.\\nÔng Green: Các bạn có thân thiện với con không?\\nTom: Có ạ. Tất cả đều tốt với con. Hôm nay chúng con học toán, địa lý và CNTT. CNTT là môn con thích nhất.\\nÔng Green: Vậy mọi việc ở trường đều ổn chứ?\\nTom: Vâng. Con đã có ngày đầu tiên tốt đẹp. Bố ơi, con có thể tham gia câu lạc bộ judo ở trường không? Con thích tập judo.\\nÔng Green: Được, nếu con thích. Nhưng đừng quên làm bài tập về nhà nhé.',items:[
['Why was Tom a little worried at first?',['Because he was late.','Because the teachers and most classmates were new.','Because he had too much homework.','Because he disliked IT.'],1,'Tom nói giáo viên và hầu hết bạn cùng lớp đều mới đối với cậu.','Vì giáo viên và hầu hết bạn cùng lớp đều mới.'],
['Were Tom’s classmates friendly to him?',['Yes, they were.','No, they weren’t.','Only one was friendly.','The passage does not say.'],0,'Tom trả lời: “They were all nice to me.”','Có, các bạn đều thân thiện với Tom.'],
['What is Tom’s favourite subject?',['Maths','Geography','IT','Art'],2,'Tom nói rõ IT là môn học yêu thích của mình.','Môn học yêu thích của Tom là CNTT.'],
['Which club does Tom want to join?',['The football club','The music club','The swimming club','The judo club'],3,'Tom hỏi bố liệu mình có thể tham gia câu lạc bộ judo không.','Tom muốn tham gia câu lạc bộ judo.'],
['Did Tom have a good first day?',['No, he didn’t.','Yes, he did.','He stayed at home.','He was absent.'],1,'Tom nói: “I had a good first day.”','Có, Tom đã có một ngày đầu tiên tốt đẹp.']
]},
{title:'Bài 3 – Library rules',passage:'Library Rules\\nWelcome to the library! We’re (1) _____ to have you here. To make sure everyone enjoys their time and keeps the library a great place to learn, please (2) _____ these simple rules:\\n• Be quiet: Keep your voice low so everyone (3) _____ read and study without distractions.\\n• Return books on time: Make sure to return borrowed books by their due date so (4) _____ can enjoy them too.\\n• Keep food and drinks outside: Please don’t eat or drink (5) _____ the library. This helps keep our space clean and the books safe.\\n• Stay focused: Use your time in the library for reading, (6) _____, or doing homework.',vi:'Nội quy thư viện\\nChào mừng bạn đến thư viện! Chúng tôi rất vui khi bạn ở đây. Để mọi người đều tận hưởng thời gian của mình và giữ thư viện là nơi học tập tuyệt vời, vui lòng tuân theo những quy tắc đơn giản sau:\\n• Giữ yên lặng: Nói nhỏ để mọi người có thể đọc và học mà không bị xao nhãng.\\n• Trả sách đúng hạn: Trả sách mượn trước hoặc đúng hạn để những người khác cũng có thể đọc.\\n• Để thức ăn và đồ uống bên ngoài: Vui lòng không ăn uống trong thư viện. Điều này giúp giữ không gian sạch sẽ và sách an toàn.\\n• Tập trung: Dùng thời gian trong thư viện để đọc, học hoặc làm bài tập về nhà.',items:[
['Blank (1): We’re _____ to have you here.',['favourite','excited','funny'],1,'“Excited to have you here” nghĩa là rất vui khi bạn đến.','Chúng tôi rất vui khi bạn ở đây.'],
['Blank (2): please _____ these simple rules.',['follow','read','research'],0,'“Follow rules” là tuân theo quy tắc.','Vui lòng tuân theo những quy tắc đơn giản này.'],
['Blank (3): so everyone _____ read and study.',['can','must','should'],0,'“Can” diễn tả khả năng/điều kiện: mọi người có thể đọc và học.','Để mọi người có thể đọc và học.'],
['Blank (4): so _____ can enjoy them too.',['another','others','the other'],1,'“Others” là những người khác.','Để những người khác cũng có thể đọc chúng.'],
['Blank (5): don’t eat or drink _____ the library.',['on','from','in'],2,'“In the library” nghĩa là trong thư viện.','Không ăn uống trong thư viện.'],
['Blank (6): reading, _____, or doing homework.',['examining','cooking','studying'],2,'Các hoạt động phù hợp trong thư viện là đọc, học hoặc làm bài tập.','Dành thời gian để đọc, học hoặc làm bài tập.']
]}]},
{title:'Unit 2 – My home',sets:[
{title:'Bài 1 – An’s bedroom',passage:'An’s bedroom is big but messy. There (1) _____ clothes on the floor. There is a big desk (2) _____ the window, and there are dirty bowls and chopsticks (3) _____ it. He usually puts his (4) _____ under the desk. His bed is (5) _____ to the desk, and it is also (6) _____. There is a cap, some CDs and some books on the bed. An’s mum is (7) _____ happy with this, and now An is tidying up (8) _____ room.',vi:'Phòng ngủ của An rộng nhưng bừa bộn. Có quần áo trên sàn nhà. Có một chiếc bàn lớn gần cửa sổ, và có bát đũa bẩn trên bàn. An thường để cặp sách dưới bàn. Giường của cậu ở cạnh bàn và cũng bừa bộn. Trên giường có một chiếc mũ lưỡi trai, vài đĩa CD và vài quyển sách. Mẹ An không hài lòng về điều này, và bây giờ An đang dọn dẹp phòng của mình.',items:[
['Blank (1): There _____ clothes on the floor.',['is','are','be','am'],1,'“Clothes” là danh từ số nhiều nên dùng “there are”.','Có quần áo trên sàn nhà.'],
['Blank (2): a big desk _____ the window.',['near','between','under','behind'],0,'“Near the window” nghĩa là gần cửa sổ.','Một chiếc bàn lớn gần cửa sổ.'],
['Blank (3): dirty bowls and chopsticks _____ it.',['in','on','under','between'],1,'Bát đũa ở trên mặt bàn nên dùng “on”.','Có bát đũa bẩn trên bàn.'],
['Blank (4): puts his _____ under the desk.',['schoolbag','wardrobe','pillow','lamp'],0,'“Schoolbag” là cặp sách, vật thường được đặt dưới bàn học.','Cậu thường để cặp sách dưới bàn.'],
['Blank (5): His bed is _____ to the desk.',['next','nearby','between','front'],0,'Cụm “next to” nghĩa là ở ngay bên cạnh.','Giường ở cạnh bàn.'],
['Blank (6): it is also _____.',['tidy','untidy','clean','new'],1,'Đoạn văn mô tả căn phòng bừa bộn; giường cũng “untidy”.','Chiếc giường cũng bừa bộn.'],
['Blank (7): An’s mum is _____ happy with this.',['no','not','never','none'],1,'Cấu trúc “be not happy with” nghĩa là không hài lòng với.','Mẹ An không hài lòng về điều này.'],
['Blank (8): tidying up _____ room.',['he','him','his','her'],2,'Trước danh từ “room” cần tính từ sở hữu “his”.','An đang dọn phòng của mình.']
]},
{title:'Bài 2 – Conversation about the new flat',passage:'Mum: We’re moving to the new flat next month. Do you want to have a new bed?\\nMi: No, I don’t, Mum. I (1) _____ my old bed. It’s so comfortable. But can I (2) _____ a new poster?\\nMum: You have three posters already. You can put them (3) _____ the wall in your new room.\\nMi: Yes, Mum. I want to have a family photo on my desk. There (4) _____ only a lamp on it now.\\nMum: That’s a good idea. Oh, where do you want to put your desk?\\nMi: (5) _____ to my bed, Mum. I also want a small plant in my room.\\nMum: That’s fine. It can go (6) _____ the bookshelf and the desk.',vi:'Mẹ: Tháng tới chúng ta sẽ chuyển đến căn hộ mới. Con có muốn có giường mới không?\\nMi: Không ạ, mẹ. Con yêu chiếc giường cũ. Nó rất thoải mái. Nhưng con có thể mua một tấm áp phích mới không?\\nMẹ: Con đã có ba tấm áp phích rồi. Con có thể treo chúng trên tường phòng mới.\\nMi: Vâng ạ. Con muốn đặt một bức ảnh gia đình trên bàn. Bây giờ trên đó chỉ có một chiếc đèn.\\nMẹ: Ý hay đấy. Con muốn đặt bàn ở đâu?\\nMi: Cạnh giường của con ạ. Con cũng muốn có một cây nhỏ trong phòng.\\nMẹ: Được thôi. Cây có thể đặt giữa kệ sách và bàn học.',items:[
['Blank (1): I _____ my old bed.',['hate','love','dislike'],1,'Mi nói giường cũ rất thoải mái, nên cô bé yêu thích nó: “love”.','Con yêu chiếc giường cũ của con.'],
['Blank (2): can I _____ a new poster?',['sell','buy','give'],1,'Mi muốn có áp phích mới nên hỏi xin mua một tấm.','Con có thể mua một tấm áp phích mới không?'],
['Blank (3): put them _____ the wall.',['in','near','on'],2,'Dùng “on the wall” để nói vật được treo trên tường.','Con có thể đặt/treo chúng trên tường.'],
['Blank (4): There _____ only a lamp on it now.',['is','are','isn’t'],0,'“A lamp” là danh từ số ít nên dùng “there is”.','Bây giờ trên bàn chỉ có một chiếc đèn.'],
['Blank (5): _____ to my bed.',['near','behind','next'],2,'Cụm “next to” nghĩa là cạnh bên.','Cạnh giường của con ạ.'],
['Blank (6): go _____ the bookshelf and the desk.',['next to','between','in front of'],1,'“Between A and B” nghĩa là ở giữa A và B.','Nó có thể đặt giữa kệ sách và bàn học.']
]},
{title:'Bài 3a – Vy and Tom’s bedrooms',passage:'Email from Vy:\\nMy bedroom is small. I have a bed, a wardrobe, a desk, a chair and a lamp. I love music, so I have three posters of famous singers on the wall. I usually do my homework at my desk in front of a big window. My room is my favourite room in the house. It’s comfortable.\\n\\nEmail from Tom:\\nHello Vy,\\nMy favourite room in the house is also my bedroom. It’s big with a bed, a wardrobe, a chair, a desk and a lamp. I don’t have any posters, but there’s a picture of my family on the wall. My desk is next to my bed. My room also has a bookshelf and a big window. I love my room. It’s cozy.',vi:'Email của Vy:\\nPhòng ngủ của mình nhỏ. Mình có một chiếc giường, tủ quần áo, bàn, ghế và đèn. Mình thích âm nhạc nên có ba áp phích của các ca sĩ nổi tiếng trên tường. Mình thường làm bài tập ở bàn trước một cửa sổ lớn. Đây là căn phòng yêu thích của mình trong nhà. Nó rất thoải mái.\\n\\nEmail của Tom:\\nChào Vy,\\nCăn phòng yêu thích của mình trong nhà cũng là phòng ngủ. Phòng rộng, có giường, tủ quần áo, ghế, bàn và đèn. Mình không có áp phích nào, nhưng có một bức ảnh gia đình trên tường. Bàn của mình cạnh giường. Phòng cũng có kệ sách và cửa sổ lớn. Mình yêu căn phòng của mình. Nó rất ấm cúng.',items:[
['Which picture shows Vy’s bedroom?',['Picture A','Picture B','Picture C','The passage does not say'],2,'Đáp án trong phần lời giải của bài là Vy’s bedroom: C.','Bức tranh C là phòng ngủ của Vy.'],
['Which picture shows Tom’s bedroom?',['Picture A','Picture B','Picture C','The passage does not say'],0,'Đáp án trong phần lời giải của bài là Tom’s bedroom: A.','Bức tranh A là phòng ngủ của Tom.']
]},
{title:'Bài 3b – Answer questions about the emails',passage:'Tom’s email: “My favourite room in the house is also my bedroom. It’s big with a bed, a wardrobe, a chair, a desk and a lamp. I don’t have any posters, but there’s a picture of my family on the wall. My desk is next to my bed. My room also has a bookshelf and a big window. I love my room. It’s cozy.”\\nVy’s email says her bedroom is small and has a bed, wardrobe, desk, chair, lamp and three posters. She says it is comfortable.',vi:'Email của Tom: “Căn phòng yêu thích của mình trong nhà cũng là phòng ngủ. Phòng rộng, có giường, tủ quần áo, ghế, bàn và đèn. Mình không có áp phích nào, nhưng có ảnh gia đình trên tường. Bàn ở cạnh giường. Phòng còn có kệ sách và cửa sổ lớn. Mình yêu căn phòng của mình. Nó rất ấm cúng.”\\nEmail của Vy nói phòng ngủ của cô bé nhỏ, có giường, tủ quần áo, bàn, ghế, đèn và ba áp phích. Cô bé nói phòng rất thoải mái.',items:[

{title:'Unit 3 – My friends',sets:[
{title:'Bài 1 – My grandma',passage:'My grandma is my best friend. She is my father’s mother. This year, she (1) _____ 70 years old. She has a round face with long, white (2) _____. She teaches me to wash the dishes and (3) _____ dinner. She is (4) _____ to other people. She helps them when she can. She is (5) _____, too. She makes me laugh all the (6) _____. I love her so much.',vi:'Bà của mình là người bạn thân nhất. Bà là mẹ của bố mình. Năm nay bà 70 tuổi. Bà có khuôn mặt tròn với mái tóc dài, bạc trắng. Bà dạy mình rửa bát và nấu bữa tối. Bà tử tế với mọi người và giúp đỡ họ khi có thể. Bà cũng rất hài hước. Bà khiến mình cười suốt. Mình yêu bà rất nhiều.',items:[
['Blank (1): she _____ 70 years old.',['am','is','are','be'],1,'Chủ ngữ “she” đi với động từ “be” là “is”.','Năm nay bà 70 tuổi.'],
['Blank (2): long, white _____.',['eyes','hair','ears','hands'],1,'“Long, white hair” nghĩa là mái tóc dài, bạc trắng.','Bà có mái tóc dài, bạc trắng.'],
['Blank (3): wash the dishes and _____ dinner.',['cook','play','read','make up'],0,'“Cook dinner” là nấu bữa tối.','Bà dạy mình rửa bát và nấu bữa tối.'],
['Blank (4): She is _____ to other people.',['kind','angry','lazy','rude'],0,'“Kind to other people” nghĩa là tử tế với người khác.','Bà tử tế với mọi người.'],
['Blank (5): She is _____, too.',['sad','funny','quietly','young'],1,'Bà khiến người kể cười, nên tính từ phù hợp là “funny” (hài hước).','Bà cũng rất hài hước.'],
['Blank (6): all the _____.',['daylight','time','hourly','minute hand'],1,'Cụm “all the time” nghĩa là suốt lúc nào cũng/liên tục.','Bà khiến mình cười suốt.']
]},
{title:'Bài 2 – Interview with Miss Hong',passage:'Reporter: So, Miss Hong, what qualities do you think a good friend should have?\\nMiss Hong: I think good friends are reliable. They never tell lies to you. They always listen to you. And they help you. They are always there when you need them, in good times and bad.\\nReporter: But do we have to be similar?\\nMiss Hong: Not necessarily. It’s best if friends have similar interests, you know, like listening to pop music or playing basketball, but we also respect the differences in others.\\nReporter: Definitely. By the way, what do you often do with your friends?\\nMiss Hong: We do lots of things, like go cycling, go swimming, and of course go shopping!',vi:'Phóng viên: Thưa cô Hồng, cô nghĩ một người bạn tốt nên có những phẩm chất nào?\\nCô Hồng: Tôi nghĩ bạn tốt là người đáng tin cậy. Họ không bao giờ nói dối bạn. Họ luôn lắng nghe và giúp đỡ bạn. Họ luôn ở bên bạn khi bạn cần, dù lúc vui hay lúc buồn.\\nPhóng viên: Nhưng chúng ta có phải giống nhau không?\\nCô Hồng: Không nhất thiết. Bạn bè có cùng sở thích thì tốt, chẳng hạn nghe nhạc pop hoặc chơi bóng rổ, nhưng chúng ta cũng tôn trọng sự khác biệt của người khác.\\nPhóng viên: Đúng vậy. Nhân tiện, cô thường làm gì với bạn bè?\\nCô Hồng: Chúng tôi làm nhiều việc như đạp xe, đi bơi và tất nhiên là đi mua sắm!',items:[
['According to Miss Hong, a good friend is _____.',['dishonest and unreliable','honest, reliable, attentive and supportive','someone who always agrees with you','someone who never helps you'],1,'Cô Hồng nói bạn tốt đáng tin cậy, không nói dối, biết lắng nghe và giúp đỡ.','Một người bạn tốt trung thực, đáng tin cậy, biết quan tâm và hỗ trợ.'],
['Do friends have to like exactly the same things?',['Yes, always.','No, they should respect differences.','Yes, they must play basketball.','No, they should never share interests.'],1,'Cô Hồng nói không nhất thiết phải giống nhau; bạn bè nên tôn trọng sự khác biệt.','Không, bạn bè nên tôn trọng sự khác biệt.'],
['What activities does Miss Hong do with her friends?',['Cycling, swimming and shopping.','Only studying.','Watching television at home only.','Cooking and cleaning.'],0,'Cô Hồng kể các hoạt động: đạp xe, bơi và mua sắm.','Cô đi đạp xe, đi bơi và đi mua sắm với bạn bè.']
]},
{title:'Bài 3 – What should a good friend do?',passage:'Miss Hong says: “Good friends are reliable. They never tell lies to you. They always listen to you. And they help you. They are always there when you need them, in good times and bad. Friends may have similar interests, but we also respect the differences in others.”',vi:'Cô Hồng nói: “Bạn tốt là người đáng tin cậy. Họ không bao giờ nói dối bạn. Họ luôn lắng nghe bạn và giúp đỡ bạn. Họ luôn ở bên bạn khi bạn cần, lúc vui cũng như lúc buồn. Bạn bè có thể có sở thích giống nhau, nhưng chúng ta cũng tôn trọng sự khác biệt của người khác.”',items:[
['A good friend listens to you.',['True','False'],0,'Bài đọc nói bạn tốt luôn lắng nghe bạn.','Một người bạn tốt lắng nghe bạn.'],
['A good friend sometimes lies to you.',['True','False'],1,'Bài đọc nói bạn tốt không bao giờ nói dối bạn, vì vậy phát biểu này sai.','Một người bạn tốt đôi khi nói dối bạn. (Sai)'],
['A good friend helps you.',['True','False'],0,'Bài đọc nói bạn tốt giúp đỡ bạn.','Một người bạn tốt giúp đỡ bạn.'],
['A good friend always likes the same things as you.',['True','False'],1,'Bạn bè không nhất thiết phải có mọi sở thích giống nhau; cần tôn trọng sự khác biệt.','Một người bạn tốt luôn thích những điều giống bạn. (Sai)'],
['A good friend shares happy and sad times with you.',['True','False'],0,'“In good times and bad” nghĩa là cả lúc vui lẫn lúc khó khăn/buồn.','Một người bạn tốt chia sẻ với bạn lúc vui và buồn.']
]}]}

let currentUnit=0,currentSet={},answers={};
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';init()}else document.getElementById('msg').textContent='Mật khẩu chưa đúng.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function init(){let tabs=document.getElementById('tabs'),root=document.getElementById('units');units.forEach((u,ui)=>{answers[ui]=u.sets.map(s=>s.items.map(()=>null));currentSet[ui]=0;let t=document.createElement('button');t.className='btn tab'+(!ui?' active':'');t.textContent=u.title;t.onclick=()=>showUnit(ui);tabs.appendChild(t);let section=document.createElement('section');section.id='unit'+ui;section.className='unit'+(!ui?' active':'');section.innerHTML='<div id="sets'+ui+'" class="tabs"></div><div id="content'+ui+'"></div>';root.appendChild(section);u.sets.forEach((s,si)=>{let st=document.createElement('button');st.className='btn tab'+(!si?' active':'');st.textContent=s.title;st.onclick=()=>showSet(ui,si);document.getElementById('sets'+ui).appendChild(st)});u.sets.forEach((s,si)=>{let d=document.createElement('div');d.className='panel';d.id=`set${ui}_${si}`;d.style.display=si?'none':'block';d.innerHTML=`<div class="meta"><h2>${s.title}</h2><div id="score${ui}_${si}" class="score"></div></div><div class="progress"><div id="bar${ui}_${si}"></div></div><div class="qnav" id="nav${ui}_${si}"></div><div id="q${ui}_${si}"></div><div class="navrow"><button class="btn secondary" id="prev${ui}_${si}" onclick="move(${ui},${si},-1)">← Câu trước</button><div><button class="btn secondary" onclick="resetSet(${ui},${si})">Reset phần này</button> <button class="btn" id="next${ui}_${si}" onclick="move(${ui},${si},1)">Câu tiếp →</button></div></div>`;document.getElementById('content'+ui).appendChild(d);render(ui,si)})})}
function showUnit(ui){currentUnit=ui;document.querySelectorAll('.unit').forEach((e,i)=>e.classList.toggle('active',i===ui));document.querySelectorAll('#tabs .tab').forEach((e,i)=>e.classList.toggle('active',i===ui))}
function showSet(ui,si){currentSet[ui]=si;document.querySelectorAll(`#sets${ui} .tab`).forEach((e,i)=>e.classList.toggle('active',i===si));units[ui].sets.forEach((_,i)=>document.getElementById(`set${ui}_${i}`).style.display=i===si?'block':'none')}
function render(ui,si){let s=units[ui].sets[si],idx=answers[ui][si].indexOf(null);let saved=window.qIndex?.[`${ui}_${si}`];if(saved===undefined)saved=0;idx=Math.min(saved,s.items.length-1);window.qIndex=window.qIndex||{};window.qIndex[`${ui}_${si}`]=idx;let it=s.items[idx],ans=answers[ui][si][idx];let nav=document.getElementById(`nav${ui}_${si}`);nav.innerHTML='';s.items.forEach((_,i)=>{let b=document.createElement('button');b.className='qnum'+(answers[ui][si][i]!==null?' done':'')+(i===idx?' current':'');b.textContent=i+1;b.onclick=()=>{window.qIndex[`${ui}_${si}`]=i;render(ui,si)};nav.appendChild(b)});let pane=`<div class="pane"><h3>Reading passage</h3><div>${s.passage.replace(/\n/g,'<br>')}</div><div class="translation"><b>Bản dịch tiếng Việt</b><div>${s.vi.replace(/\n/g,'<br>')}</div></div></div><div class="pane"><h3>Question ${idx+1}/${s.items.length}</h3><div class="question">${it[0]}</div><div class="options">`;it[1].forEach((o,oi)=>{let cls='opt';if(ans!==null){if(oi===it[2])cls+=' correct';else if(oi===ans)cls+=' wrong'}pane+=`<button class="${cls}" ${ans!==null?'disabled':''} onclick="answer(${ui},${si},${idx},${oi})">${String.fromCharCode(65+oi)}. ${o}</button>`});pane+='</div>';if(ans!==null){let ok=ans===it[2];pane+=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Chính xác!':'✗ Chưa chính xác.'}</b><p><b>Đáp án đúng:</b> ${String.fromCharCode(65+it[2])}. ${it[1][it[2]]}</p><p><b>Giải thích:</b> ${it[3]}</p><p><b>Nghĩa tiếng Việt:</b> ${it[4]}</p></div>`}pane+='</div>';document.getElementById(`q${ui}_${si}`).innerHTML=`<div class="small">Câu ${idx+1} trên ${s.items.length}. Chọn một đáp án; lựa chọn sẽ bị khóa.</div><div class="layout">${pane}</div>`;document.getElementById(`prev${ui}_${si}`).disabled=idx===0;document.getElementById(`next${ui}_${si}`).disabled=idx===s.items.length-1;let done=answers[ui][si].filter(x=>x!==null).length,score=answers[ui][si].filter((x,i)=>x===s.items[i][2]).length;document.getElementById(`score${ui}_${si}`).textContent=`Điểm: ${score}/${s.items.length} · Đã làm ${done}/${s.items.length}`;document.getElementById(`bar${ui}_${si}`).style.width=done/s.items.length*100+'%'}
function answer(ui,si,idx,choice){if(answers[ui][si][idx]!==null)return;answers[ui][si][idx]=choice;render(ui,si)}
function move(ui,si,delta){let k=`${ui}_${si}`,idx=window.qIndex[k]||0;window.qIndex[k]=Math.max(0,Math.min(units[ui].sets[si].items.length-1,idx+delta));render(ui,si)}
function resetSet(ui,si){if(!confirm('Bạn muốn xóa điểm và làm lại phần này?'))return;answers[ui][si]=units[ui].sets[si].items.map(()=>null);window.qIndex[`${ui}_${si}`]=0;render(ui,si)}
</script></body></html>
